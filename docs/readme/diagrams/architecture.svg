<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<defs>
<radialGradient id="glow" cx="50%" cy="0%" r="90%"><stop offset="0" stop-color="#211b10"/><stop offset="1" stop-color="#0b0a08"/></radialGradient>
<marker id="h" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M2,2 L10,6 L2,10" fill="none" stroke="#d6b25e" stroke-width="1.4"/></marker>
</defs>
<rect width="1600" height="900" fill="url(#glow)"/>
<rect x="22" y="22" width="1556" height="856" fill="none" stroke="#5e4d27"/>
<rect x="30" y="30" width="1540" height="840" fill="none" stroke="#3b3324"/>
<path d="M22,15 L29,22 L22,29 L15,22 z" fill="#d6b25e"/><path d="M1578,15 L1585,22 L1578,29 L1571,22 z" fill="#d6b25e"/><path d="M22,871 L29,878 L22,885 L15,878 z" fill="#d6b25e"/><path d="M1578,871 L1585,878 L1578,885 L1571,878 z" fill="#d6b25e"/>
<line x1="631.25" y1="96" x2="701.25" y2="96" stroke="#a88a45"/>
<line x1="898.75" y1="96" x2="968.75" y2="96" stroke="#a88a45"/>
<text x="800" y="101" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="14" letter-spacing="4" fill="#a88a45">HOW IT IS BUILT</text>
<text x="800" y="166" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="50" fill="#f1e8d4">The game in the browser, <tspan font-style="italic" fill="#d6b25e">live agents</tspan> on the server</text>
<text x="800" y="210" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="21" fill="#9a8f7a">Every live part has a rules fallback, so the app runs even with no API key.</text><text x="310" y="290" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="15" letter-spacing="3" fill="#a88a45">IN THE BROWSER</text><line x1="230" y1="306" x2="390" y2="306" stroke="#5e4d27"/><rect x="110" y="417" width="400" height="128" fill="#13110d" stroke="#5e4d27" stroke-width="1"/><text x="310" y="475" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#f1e8d4">The game</text><text x="310" y="513" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="21" fill="#9a8f7a">case file · clock · saves itself</text><rect x="110" y="571" width="400" height="128" fill="#13110d" stroke="#5e4d27" stroke-width="1"/><text x="310" y="629" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#f1e8d4">The rules engine</text><text x="310" y="667" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="21" fill="#9a8f7a">prices and scores every action</text><text x="800" y="290" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="15" letter-spacing="3" fill="#a88a45">ON OUR SERVER</text><line x1="720" y1="306" x2="880" y2="306" stroke="#5e4d27"/><rect x="600" y="340" width="400" height="128" fill="#1d180f" stroke="#d6b25e" stroke-width="1.5"/><text x="800" y="398" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#d6b25e">Staff agents</text><text x="800" y="436" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="21" fill="#9a8f7a">a director and their team</text><rect x="600" y="494" width="400" height="128" fill="#1d180f" stroke="#d6b25e" stroke-width="1.5"/><text x="800" y="552" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#d6b25e">Rival agents</text><text x="800" y="590" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="21" fill="#9a8f7a">the other campaigns in the race</text><rect x="600" y="648" width="400" height="128" fill="#1d180f" stroke="#d6b25e" stroke-width="1.5"/><text x="800" y="706" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#d6b25e">Debrief agent</text><text x="800" y="744" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="21" fill="#9a8f7a">reviews your whole campaign</text><text x="1290" y="290" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="15" letter-spacing="3" fill="#a88a45">THE MODELS</text><line x1="1210" y1="306" x2="1370" y2="306" stroke="#5e4d27"/><rect x="1090" y="340" width="400" height="128" fill="#13110d" stroke="#5e4d27" stroke-width="1"/><text x="1290" y="398" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#f1e8d4">Claude</text><text x="1290" y="436" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="21" fill="#9a8f7a">Opus · Sonnet · Haiku</text><rect x="1090" y="494" width="400" height="128" fill="#13110d" stroke="#5e4d27" stroke-width="1"/><text x="1290" y="552" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#f1e8d4">Gemini</text><text x="1290" y="590" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="21" fill="#9a8f7a">writes the morning paper</text><rect x="1090" y="648" width="400" height="128" fill="#13110d" stroke="#5e4d27" stroke-width="1"/><text x="1290" y="706" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#f1e8d4">LangSmith</text><text x="1290" y="744" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="21" fill="#9a8f7a">traces every agent run</text><path d="M516,470 L594,470" fill="none" stroke="#a88a45" stroke-width="1.3" marker-end="url(#h)"/><path d="M594,560 L516,560" fill="none" stroke="#a88a45" stroke-width="1.3" marker-end="url(#h)"/><text x="555" y="456" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic" fill="#9a8f7a">state</text><text x="555" y="586" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic" fill="#9a8f7a">actions</text><path d="M1006,404 L1084,404" fill="none" stroke="#a88a45" stroke-width="1.3" marker-end="url(#h)"/><path d="M1006,558 L1084,558" fill="none" stroke="#a88a45" stroke-width="1.3" marker-end="url(#h)"/><path d="M1006,712 L1084,712" fill="none" stroke="#a88a45" stroke-width="1.3" marker-end="url(#h)"/><line x1="140" y1="820" x2="1460" y2="820" stroke="#3b3324"/><text x="800" y="856" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-style="italic" fill="#f1e8d4">No model ever sets a poll number, a cost or an effect. The engine does.</text></svg>
