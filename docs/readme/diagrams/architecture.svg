<text x="800" y="101" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="14" letter-spacing="4" fill="#a88a45">FIGURE 2</text>
<text x="800" y="166" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="50" fill="#f1e8d4">System architecture</text>
<text x="800" y="210" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="21" fill="#9a8f7a">Campaign state lives in the browser. Each request carries a snapshot; the server keeps no state between requests.</text><text x="260" y="262" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="15" letter-spacing="3" fill="#a88a45">BROWSER</text><text x="790" y="262" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="15" letter-spacing="3" fill="#a88a45">NEXT.JS API ROUTES</text><text x="1320" y="262" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="15" letter-spacing="3" fill="#a88a45">MODELS AND SERVICES</text><rect x="70" y="290" width="380" height="170" fill="#13110d" stroke="#5e4d27" stroke-width="1"/><text x="98" y="352" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#f1e8d4">Screens</text><text x="98" y="390" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">Case · Profile · War room</text><text x="98" y="418" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">Map · Factions · Morning paper</text><text x="98" y="446" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">Top bar: money, polls, weekly plan</text><rect x="70" y="490" width="380" height="170" fill="#13110d" stroke="#5e4d27" stroke-width="1"/><text x="98" y="552" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#f1e8d4">Campaign state</text><text x="98" y="590" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">Case store (zustand)</text><text x="98" y="618" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">Daily clock: stops at decisions</text><text x="98" y="646" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">Saved in the browser (localStorage)</text><rect x="70" y="690" width="380" height="200" fill="#1d180f" stroke="#d6b25e" stroke-width="1.5"/><text x="98" y="752" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#d6b25e">Simulation engine</text><text x="98" y="790" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="17" fill="#a88a45">simulate(case, picks, work)</text><text x="98" y="818" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">Pure and deterministic</text><text x="98" y="846" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">Prices and scores every action</text><text x="98" y="874" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">Fitted to the certified result</text><rect x="70" y="920" width="380" height="140" fill="#13110d" stroke="#5e4d27" stroke-width="1"/><text x="98" y="982" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#f1e8d4">Rules fallbacks</text><text x="98" y="1020" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">Used with no API key or on failure</text><text x="98" y="1048" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">Emit the same events</text><rect x="530" y="290" width="520" height="200" fill="#1d180f" stroke="#d6b25e" stroke-width="1.5"/><text x="1026" y="324" text-anchor="end" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="15" letter-spacing="3" fill="#9a8f7a">DEEP AGENT</text><text x="558" y="352" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#d6b25e">Staff orders</text><text x="558" y="390" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="17" fill="#a88a45">POST /api/staff/instruct</text><text x="558" y="418" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">One deep agent per order</text><text x="558" y="446" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">Director (Opus), team as subagents (Haiku)</text><text x="558" y="474" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">Streams NDJSON events to the War room</text><rect x="530" y="510" width="520" height="140" fill="#1d180f" stroke="#d6b25e" stroke-width="1.5"/><text x="1026" y="544" text-anchor="end" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="15" letter-spacing="3" fill="#9a8f7a">DEEP AGENT</text><text x="558" y="572" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#d6b25e">Rival campaigns</text><text x="558" y="610" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">One deep agent per rival, run in parallel</text><text x="558" y="638" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">Tool make_move, scored by the engine</text><rect x="530" y="670" width="520" height="140" fill="#1d180f" stroke="#d6b25e" stroke-width="1.5"/><text x="1026" y="704" text-anchor="end" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="15" letter-spacing="3" fill="#9a8f7a">DEEP AGENT</text><text x="558" y="732" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#d6b25e">Election debrief</text><text x="558" y="770" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">Read-only virtual filesystem of the campaign</text><text x="558" y="798" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">Seven subagents in parallel (Sonnet)</text><rect x="530" y="830" width="520" height="120" fill="#13110d" stroke="#5e4d27" stroke-width="1"/><text x="558" y="892" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#f1e8d4">Single model calls</text><text x="558" y="930" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">Decision memos · planks · remarks · hiring</text><rect x="530" y="970" width="520" height="90" fill="#13110d" stroke="#5e4d27" stroke-width="1"/><text x="558" y="1032" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#f1e8d4">Morning paper</text><text x="780" y="1032" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">stories · letters · stances</text><rect x="1110" y="290" width="420" height="110" fill="#13110d" stroke="#5e4d27" stroke-width="1"/><text x="1138" y="352" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#f1e8d4">Claude Opus 5.5</text><text x="1138" y="390" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">directors · decision memos</text><rect x="1110" y="420" width="420" height="110" fill="#13110d" stroke="#5e4d27" stroke-width="1"/><text x="1138" y="482" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#f1e8d4">Claude Haiku 5.5</text><text x="1138" y="520" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">staff subagents · rivals</text><rect x="1110" y="670" width="420" height="110" fill="#13110d" stroke="#5e4d27" stroke-width="1"/><text x="1138" y="732" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#f1e8d4">Claude Sonnet 5.5</text><text x="1138" y="770" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">election debrief</text><rect x="1110" y="800" width="420" height="110" fill="#13110d" stroke="#5e4d27" stroke-width="1"/><text x="1138" y="862" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#f1e8d4">LangSmith</text><text x="1138" y="900" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">traces of LangChain runs</text><rect x="1110" y="970" width="420" height="90" fill="#13110d" stroke="#5e4d27" stroke-width="1"/><text x="1138" y="1032" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#f1e8d4">Gemini 3.8 Flash</text><text x="1370" y="1032" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">Claude as fallback</text><path d="M450,350 L530,350" fill="none" stroke="#a88a45" stroke-width="1.3" marker-end="url(#h)"/><text x="490" y="338" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" fill="#9a8f7a">snapshot</text><path d="M530,430 L450,430" fill="none" stroke="#a88a45" stroke-width="1.3" marker-end="url(#h)"/><text x="490" y="452" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" fill="#9a8f7a">events</text><path d="M530,470 L490,470 L490,760 L456,760" fill="none" stroke="#a88a45" stroke-width="1.3" stroke-dasharray="5 6" marker-end="url(#h)"/><text x="490" y="620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" fill="#9a8f7a">resolve()</text><path d="M1050,345 L1110,345" fill="none" stroke="#a88a45" stroke-width="1.3" marker-end="url(#h)"/><path d="M1050,400 L1080,400 L1080,470 L1110,470" fill="none" stroke="#a88a45" stroke-width="1.3" marker-end="url(#h)"/><path d="M1050,580 L1080,580 L1080,490 L1110,490" fill="none" stroke="#a88a45" stroke-width="1.3" marker-end="url(#h)"/><path d="M1050,740 L1110,725" fill="none" stroke="#a88a45" stroke-width="1.3" marker-end="url(#h)"/><path d="M1050,1015 L1110,1015" fill="none" stroke="#a88a45" stroke-width="1.3" marker-end="url(#h)"/><path d="M1050,455 L1095,455 L1095,855 L1110,855" fill="none" stroke="#a88a45" stroke-width="1.3" stroke-dasharray="5 6" marker-end="url(#h)"/></svg>
