<text x="64" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="3" fill="#8b8070">CAMPAIGN ACADEMY · SYSTEM ARCHITECTURE</text>
<text x="64" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#efe6d2">One browser, one Next.js server, <tspan font-style="italic" fill="#d9b45a">live agents</tspan> behind every screen</text>
<text x="64" y="166" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="19" fill="#8b8070">The game state lives in the browser. Each request sends a snapshot; the server keeps nothing between orders.</text><rect x="50" y="200" width="430" height="720" rx="10" fill="#120f0a" stroke="#3a3224" stroke-dasharray="4 5"/>
