<text x="64" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="3" fill="#8b8070">CAMPAIGN ACADEMY · EVALS (#28)</text>
<text x="64" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#efe6d2">The agents <tspan font-style="italic" fill="#d9b45a">follow the facts</tspan>. Past memory, they add <tspan font-style="italic" fill="#d9b45a">little</tspan>.</text>
<text x="64" y="166" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="19" fill="#8b8070">No student: an agent plays de Blasio, live agents play everyone else, and each sees only facts dated before the decision.</text><text x="64" y="246" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#8b8070">GROUNDING · TUNED SET, RUN 7</text><text x="64" y="302" text-anchor="start" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#efe6d2">Facts rewritten to point away: moved</text><rect x="520" y="276" width="919.9999999999999" height="38" fill="#1a160f"/><rect x="520" y="276" width="717.5999999999999" height="38" fill="#d9b45a"/><text x="1251.6" y="303" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="400" fill="#efe6d2">78%</text><text x="1319.6" y="302" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#8b8070">28 of 36</text><text x="64" y="366" text-anchor="start" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#efe6d2">Control, same facts reworded: held</text><rect x="520" y="340" width="919.9999999999999" height="38" fill="#1a160f"/><rect x="520" y="340" width="864.8" height="38" fill="#8f7638"/><text x="1398.8" y="367" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="400" fill="#efe6d2">94%</text><text x="1466.8" y="366" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#8b8070">17 of 18</text><text x="64" y="410" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#8b8070">HELD OUT · 11 NEW DECISIONS, RUN ONCE</text><text x="64" y="466" text-anchor="start" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#efe6d2">On the card: chose what really happened</text><rect x="520" y="440" width="919.9999999999999" height="38" fill="#1a160f"/><rect x="520" y="440" width="644" height="38" fill="#7d9bc4"/><text x="1178" y="467" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="400" fill="#efe6d2">70%</text><text x="1246" y="466" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#8b8070">23 of 33</text><text x="64" y="530" text-anchor="start" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#efe6d2">Memory alone, no card</text><rect x="520" y="504" width="919.9999999999999" height="38" fill="#1a160f"/><rect x="520" y="504" width="616.4" height="38" fill="#4c5d78"/><text x="1150.4" y="531" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="400" fill="#efe6d2">67%</text><text x="1218.4" y="530" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#8b8070">22 of 33</text><line x1="740.8" y1="452" x2="740.8" y2="552" stroke="#8b8070" stroke-dasharray="4 4"/><text x="746.8" y="574" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8b8070">chance ≈ 24%</text><line x1="64" y1="608" x2="1536" y2="608" stroke="#3a3224"/><text x="64" y="652" text-anchor="start" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#d9b45a">Memory wrong, card right</text><text x="400" y="652" text-anchor="start" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#efe6d2">11 of 11 on the tuned set (all at the second ad) · 2 of 11 held out</text><text x="64" y="692" text-anchor="start" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#d9b45a">Why not plain agreement</text><text x="400" y="692" text-anchor="start" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#efe6d2">with no card at all, the model names the real choice at 5 of 6 decisions</text><text x="64" y="732" text-anchor="start" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#d9b45a">Whole campaign, no student</text><text x="400" y="732" text-anchor="start" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#efe6d2">6 of 6 real choices · 32 weekly meetings · 294 staff jobs</text></svg>
