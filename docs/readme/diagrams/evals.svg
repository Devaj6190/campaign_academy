<rect x="22" y="22" width="1556" height="856" fill="none" stroke="#5e4d27"/>
<rect x="30" y="30" width="1540" height="840" fill="none" stroke="#3b3324"/>
<path d="M22,15 L29,22 L22,29 L15,22 z" fill="#d6b25e"/><path d="M1578,15 L1585,22 L1578,29 L1571,22 z" fill="#d6b25e"/><path d="M22,871 L29,878 L22,885 L15,878 z" fill="#d6b25e"/><path d="M1578,871 L1585,878 L1578,885 L1571,878 z" fill="#d6b25e"/>
<line x1="668" y1="96" x2="738" y2="96" stroke="#a88a45"/>
<line x1="862" y1="96" x2="932" y2="96" stroke="#a88a45"/>
<text x="800" y="101" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="14" letter-spacing="4" fill="#a88a45">FIGURE 6</text>
<text x="800" y="166" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="50" fill="#f1e8d4">Evals: agent decisions against the record</text>
<text x="800" y="210" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="21" fill="#9a8f7a">No student: an agent plays de Blasio, and each agent sees only what was known on the day.</text><text x="450" y="290" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="15" letter-spacing="3" fill="#a88a45">GROUNDING · TUNED SET</text><text x="150" y="340" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="22" fill="#f1e8d4">Facts rewritten to point elsewhere: it moved</text><rect x="150" y="362" width="600" height="10" fill="#3b3324"/><rect x="150" y="362" width="468" height="10" fill="#d6b25e"/><text x="150" y="436" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="54" fill="#d6b25e">78%</text><text x="285" y="430" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="19" fill="#9a8f7a">28 of 36</text><text x="150" y="490" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="22" fill="#f1e8d4">Same facts, new words: it held</text><rect x="150" y="512" width="600" height="10" fill="#3b3324"/><rect x="150" y="512" width="564" height="10" fill="#a88a45"/><text x="150" y="586" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="54" fill="#a88a45">94%</text><text x="285" y="580" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="19" fill="#9a8f7a">17 of 18</text><text x="450" y="680" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-style="italic" fill="#9a8f7a">Choices change with the evidence, not the wording.</text><line x1="800" y1="280" x2="800" y2="700" stroke="#3b3324"/><text x="1150" y="290" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="15" letter-spacing="3" fill="#a88a45">11 HELD-OUT DECISIONS · RUN ONCE</text><text x="850" y="340" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="22" fill="#f1e8d4">With the card: chose what really happened</text><rect x="850" y="362" width="600" height="10" fill="#3b3324"/><rect x="850" y="362" width="420" height="10" fill="#f1e8d4"/><text x="850" y="436" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="54" fill="#f1e8d4">70%</text><text x="985" y="430" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="19" fill="#9a8f7a">23 of 33</text><text x="850" y="490" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="22" fill="#f1e8d4">Memory alone, no card</text><rect x="850" y="512" width="600" height="10" fill="#3b3324"/><rect x="850" y="512" width="402" height="10" fill="#9a8f7a"/><text x="850" y="586" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="54" fill="#9a8f7a">67%</text><text x="985" y="580" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="19" fill="#9a8f7a">22 of 33</text><text x="1150" y="680" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-style="italic" fill="#9a8f7a">On new decisions, the card adds little to memory.</text><line x1="140" y1="740" x2="1460" y2="740" stroke="#3b3324"/><text x="800" y="796" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#f1e8d4">The model already knows this race, so plain agreement mostly measures memory.</text><text x="800" y="830" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#f1e8d4">We score whether choices follow the facts instead.</text></svg>
