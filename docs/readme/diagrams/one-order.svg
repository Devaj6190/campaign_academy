<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 860" width="1600" height="860">
<defs>
<radialGradient id="glow" cx="50%" cy="0%" r="90%"><stop offset="0" stop-color="#211b10"/><stop offset="1" stop-color="#0b0a08"/></radialGradient>
<marker id="h" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M2,2 L10,6 L2,10" fill="none" stroke="#d6b25e" stroke-width="1.4"/></marker>
</defs>
<rect width="1600" height="860" fill="url(#glow)"/>
<rect x="22" y="22" width="1556" height="816" fill="none" stroke="#5e4d27"/>
<rect x="30" y="30" width="1540" height="800" fill="none" stroke="#3b3324"/>
<path d="M22,15 L29,22 L22,29 L15,22 z" fill="#d6b25e"/><path d="M1578,15 L1585,22 L1578,29 L1571,22 z" fill="#d6b25e"/><path d="M22,831 L29,838 L22,845 L15,838 z" fill="#d6b25e"/><path d="M1578,831 L1585,838 L1578,845 L1571,838 z" fill="#d6b25e"/>
<line x1="599.75" y1="96" x2="669.75" y2="96" stroke="#a88a45"/>
<line x1="930.25" y1="96" x2="1000.25" y2="96" stroke="#a88a45"/>
<text x="800" y="101" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="14" letter-spacing="4" fill="#a88a45">ONE ORDER, END TO END</text>
<text x="800" y="166" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="50" fill="#f1e8d4">You give an order. <tspan font-style="italic" fill="#d6b25e">A team</tspan> does the work.</text>
<text x="800" y="210" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="21" fill="#9a8f7a">A live run in the War room takes about 10 to 24 seconds.</text><rect x="107" y="300" width="250" height="190" fill="#13110d" stroke="#5e4d27" stroke-width="1"/><text x="232" y="374" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#f1e8d4">You</text><text x="232" y="412" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="21" fill="#9a8f7a">type an order</text><text x="232" y="441" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="21" fill="#9a8f7a">in plain English</text><circle cx="232" cy="300" r="22" fill="#0b0a08" stroke="#d6b25e"/><text x="232" y="308" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#d6b25e">1</text><path d="M363,395 L385,395" fill="none" stroke="#a88a45" stroke-width="1.3" marker-end="url(#h)"/><rect x="391" y="300" width="250" height="190" fill="#1d180f" stroke="#d6b25e" stroke-width="1.5"/><text x="516" y="374" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#d6b25e">The director</text><text x="516" y="412" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="21" fill="#9a8f7a">plans it and splits</text><text x="516" y="441" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="21" fill="#9a8f7a">it into jobs</text><circle cx="516" cy="300" r="22" fill="#0b0a08" stroke="#d6b25e"/><text x="516" y="308" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#d6b25e">2</text><path d="M647,395 L669,395" fill="none" stroke="#a88a45" stroke-width="1.3" marker-end="url(#h)"/><rect x="675" y="300" width="250" height="190" fill="#1d180f" stroke="#d6b25e" stroke-width="1.5"/><text x="800" y="374" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#d6b25e">The team</text><text x="800" y="412" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="21" fill="#9a8f7a">each takes a job,</text><text x="800" y="441" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="21" fill="#9a8f7a">all at once</text><circle cx="800" cy="300" r="22" fill="#0b0a08" stroke="#d6b25e"/><text x="800" y="308" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#d6b25e">3</text><path d="M931,395 L953,395" fill="none" stroke="#a88a45" stroke-width="1.3" marker-end="url(#h)"/><rect x="959" y="300" width="250" height="190" fill="#13110d" stroke="#5e4d27" stroke-width="1"/><text x="1084" y="374" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#f1e8d4">The engine</text><text x="1084" y="412" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="21" fill="#9a8f7a">prices and scores</text><text x="1084" y="441" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="21" fill="#9a8f7a">every action</text><circle cx="1084" cy="300" r="22" fill="#0b0a08" stroke="#d6b25e"/><text x="1084" y="308" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#d6b25e">4</text><path d="M1215,395 L1237,395" fill="none" stroke="#a88a45" stroke-width="1.3" marker-end="url(#h)"/><rect x="1243" y="300" width="250" height="190" fill="#13110d" stroke="#5e4d27" stroke-width="1"/><text x="1368" y="374" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#f1e8d4">The report</text><text x="1368" y="412" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="21" fill="#9a8f7a">checked, then</text><text x="1368" y="441" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="21" fill="#9a8f7a">streamed back</text><circle cx="1368" cy="300" r="22" fill="#0b0a08" stroke="#d6b25e"/><text x="1368" y="308" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#d6b25e">5</text><text x="516" y="524" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="15" letter-spacing="3" fill="#9a8f7a">CLAUDE OPUS DEEP AGENT</text><text x="800" y="524" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="15" letter-spacing="3" fill="#9a8f7a">CLAUDE HAIKU SUBAGENTS</text><text x="1084" y="524" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="15" letter-spacing="3" fill="#9a8f7a">SAME RULES AS THE GAME</text><text x="1368" y="524" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="15" letter-spacing="3" fill="#9a8f7a">TWO GUARDS</text><line x1="140" y1="580" x2="1460" y2="580" stroke="#3b3324"/><text x="800" y="630" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="15" letter-spacing="3" fill="#a88a45">FOR EXAMPLE</text><text x="800" y="680" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-style="italic" fill="#f1e8d4">“Canvass our strongest neighbourhoods this week, $25,000.”</text><text x="800" y="724" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="21" fill="#9a8f7a">The field director gives the doors to one organizer and the phone calls to another.</text><text x="800" y="756" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#d6b25e">The report says what was spent and which districts moved.</text><text x="800" y="800" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="19" fill="#9a8f7a">The guards: a number the agent was never shown is sent back; anything from after the game's date is cut.</text></svg>
