<radialGradient id="glow" cx="50%" cy="0%" r="90%"><stop offset="0" stop-color="#211b10"/><stop offset="1" stop-color="#0b0a08"/></radialGradient>
<marker id="h" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M2,2 L10,6 L2,10" fill="none" stroke="#d6b25e" stroke-width="1.4"/></marker>
</defs>
<rect width="1600" height="1220" fill="url(#glow)"/>
<rect x="22" y="22" width="1556" height="1176" fill="none" stroke="#5e4d27"/>
<rect x="30" y="30" width="1540" height="1160" fill="none" stroke="#3b3324"/>
<path d="M22,15 L29,22 L22,29 L15,22 z" fill="#d6b25e"/><path d="M1578,15 L1585,22 L1578,29 L1571,22 z" fill="#d6b25e"/><path d="M22,1191 L29,1198 L22,1205 L15,1198 z" fill="#d6b25e"/><path d="M1578,1191 L1585,1198 L1578,1205 L1571,1198 z" fill="#d6b25e"/>
<line x1="668" y1="96" x2="738" y2="96" stroke="#a88a45"/>
<line x1="862" y1="96" x2="932" y2="96" stroke="#a88a45"/>
<text x="800" y="101" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="14" letter-spacing="4" fill="#a88a45">FIGURE 3</text>
<text x="800" y="166" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="50" fill="#f1e8d4">Processing of one staff order</text>
<text x="800" y="210" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="21" fill="#9a8f7a">From the student's instruction to the report, as it runs in the War room.</text><rect x="60" y="270" width="460" height="270" fill="#13110d" stroke="#5e4d27" stroke-width="1"/><circle cx="94" cy="270" r="22" fill="#0b0a08" stroke="#d6b25e"/><text x="94" y="278" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#d6b25e">1</text><text x="88" y="332" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#f1e8d4">Instruction</text><text x="88" y="370" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">The student writes an order to one director.</text><text x="88" y="398" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">Example: canvass our strongest districts,</text><text x="88" y="426" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">$25,000.</text><text x="88" y="454" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">Budget read from the text: $80,000 by</text><text x="88" y="482" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">default, at most $250,000.</text><rect x="570" y="270" width="460" height="270" fill="#13110d" stroke="#5e4d27" stroke-width="1"/><circle cx="604" cy="270" r="22" fill="#0b0a08" stroke="#d6b25e"/><text x="604" y="278" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#d6b25e">2</text><text x="598" y="332" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#f1e8d4">Context</text><text x="598" y="370" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">Campaign snapshot from the browser: date,</text><text x="598" y="398" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">cash, polls, calendar, platform, voter</text><text x="598" y="426" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">groups and support in every district.</text><text x="598" y="454" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="17" fill="#a88a45">/memory/AGENTS.md  (12 lines at most)</text><text x="598" y="482" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">Action catalog with engine prices.</text><rect x="1080" y="270" width="460" height="270" fill="#1d180f" stroke="#d6b25e" stroke-width="1.5"/><circle cx="1114" cy="270" r="22" fill="#0b0a08" stroke="#d6b25e"/><text x="1114" y="278" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#d6b25e">3</text><text x="1516" y="304" text-anchor="end" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="15" letter-spacing="3" fill="#9a8f7a">OPUS · DEEP AGENT</text><text x="1108" y="332" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#d6b25e">Director</text><text x="1108" y="370" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">Plans the order and splits it into jobs.</text><text x="1108" y="398" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">Assigns each job by role and strengths.</text><text x="1108" y="426" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="17" fill="#a88a45">task  hand a job to a subagent</text><text x="1108" y="454" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="17" fill="#a88a45">propose  2–3 priced options</text><text x="1108" y="482" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="17" fill="#a88a45">send_report  close the order</text><rect x="1080" y="600" width="460" height="270" fill="#1d180f" stroke="#d6b25e" stroke-width="1.5"/><circle cx="1114" cy="600" r="22" fill="#0b0a08" stroke="#d6b25e"/><text x="1114" y="608" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#d6b25e">4</text><text x="1516" y="634" text-anchor="end" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="15" letter-spacing="3" fill="#9a8f7a">HAIKU · SUBAGENTS</text><text x="1108" y="662" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#d6b25e">Team</text><text x="1108" y="700" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">One subagent per job, run in parallel.</text><text x="1108" y="728" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">Isolated context: sees only its brief.</text><text x="1108" y="756" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">Own prompt, in its own voice.</text><text x="1108" y="784" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="17" fill="#a88a45">take_action { why, action, target }</text><text x="1108" y="812" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">The reason is written before the choice.</text><rect x="570" y="600" width="460" height="270" fill="#13110d" stroke="#5e4d27" stroke-width="1"/><circle cx="604" cy="600" r="22" fill="#0b0a08" stroke="#d6b25e"/><text x="604" y="608" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#d6b25e">5</text><text x="598" y="662" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#f1e8d4">Engine</text><text x="598" y="700" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="17" fill="#a88a45">resolve(action)</text><text x="598" y="728" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">Refuses anything over the order budget.</text><text x="598" y="756" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">Prices the action from the catalog.</text><text x="598" y="784" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">Moves support in districts and groups.</text><text x="598" y="812" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">Returns the result and budget left.</text><rect x="60" y="600" width="460" height="270" fill="#13110d" stroke="#5e4d27" stroke-width="1"/><circle cx="94" cy="600" r="22" fill="#0b0a08" stroke="#d6b25e"/><text x="94" y="608" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#d6b25e">6</text><text x="88" y="662" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#f1e8d4">Report and guards</text><text x="88" y="700" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">The director drafts the report.</text><text x="88" y="728" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">Number ledger: a figure the agent was</text><text x="88" y="756" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">never shown is sent back once, then cut.</text><text x="88" y="784" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">Hindsight filter: lines past the date are cut.</text><text x="88" y="812" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#9a8f7a">The memory file records the order.</text><path d="M520,405 L570,405" fill="none" stroke="#a88a45" stroke-width="1.3" marker-end="url(#h)"/><path d="M1030,405 L1080,405" fill="none" stroke="#a88a45" stroke-width="1.3" marker-end="url(#h)"/><path d="M1310,540 L1310,600" fill="none" stroke="#a88a45" stroke-width="1.3" marker-end="url(#h)"/><text x="1322" y="576" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" fill="#9a8f7a">task × N</text><path d="M1080,705 L1030,705" fill="none" stroke="#a88a45" stroke-width="1.3" marker-end="url(#h)"/><text x="1055" y="690" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" fill="#9a8f7a">action</text><path d="M1030,765 L1080,765" fill="none" stroke="#a88a45" stroke-width="1.3" marker-end="url(#h)"/><text x="1055" y="792" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" fill="#9a8f7a">result</text><path d="M1310,870 L1310,905 L290,905 L290,874" fill="none" stroke="#a88a45" stroke-width="1.3" stroke-dasharray="5 6" marker-end="url(#h)"/><text x="800" y="897" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" fill="#9a8f7a">jobs done → director → send_report</text><rect x="60" y="950" width="1480" height="210" fill="#13110d" stroke="#5e4d27" stroke-width="1"/><circle cx="94" cy="950" r="22" fill="#0b0a08" stroke="#d6b25e"/><text x="94" y="958" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#d6b25e">7</text><text x="88" y="1012" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#f1e8d4">Live view in the War room</text><rect x="88" y="1036" width="130" height="34" fill="none" stroke="#a88a45"/><text x="153" y="1059" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="16" fill="#d6b25e">thought</text><rect x="234" y="1036" width="130" height="34" fill="none" stroke="#a88a45"/><text x="299" y="1059" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="16" fill="#d6b25e">delegate</text><rect x="380" y="1036" width="130" height="34" fill="none" stroke="#a88a45"/><text x="445" y="1059" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="16" fill="#d6b25e">action</text><rect x="526" y="1036" width="130" height="34" fill="none" stroke="#a88a45"/><text x="591" y="1059" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="16" fill="#d6b25e">job done</text><rect x="672" y="1036" width="130" height="34" fill="none" stroke="#a88a45"/><text x="737" y="1059" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="16" fill="#d6b25e">report</text><rect x="818" y="1036" width="130" height="34" fill="none" stroke="#a88a45"/><text x="883" y="1059" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="16" fill="#d6b25e">proposals</text><text x="88" y="1112" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="16" fill="#9a8f7a">NDJSON events, streamed as each step happens</text><text x="1010" y="1030" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#f1e8d4">·  Thinking: each agent's reasoning, line by line</text><text x="1010" y="1062" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#f1e8d4">·  Hand-offs drawn between director and team</text><text x="1010" y="1094" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#f1e8d4">·  Report: spent, effects, money asked for</text><text x="1010" y="1126" text-anchor="start" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#f1e8d4">·  Delegation grade: clarity, right people</text></svg>
