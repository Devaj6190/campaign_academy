 sans-serif" font-weight="600" font-size="19" fill="#7d9bc4">Rival moves</text><text x="1290" y="623" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#8b8070">four rival agents</text><rect x="1060" y="666" width="460" height="84" rx="6" fill="#141b26" stroke="#7d9bc4" stroke-width="1.6"/><text x="1290" y="701" text-anchor="middle" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-weight="600" font-size="19" fill="#7d9bc4">Your planks</text><text x="1290" y="727" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#8b8070">groups served and cost</text><rect x="650" y="330" width="300" height="120" rx="6" fill="#16130d" stroke="#efe6d2" stroke-width="1.6"/><rect x="660" y="340" width="68" height="20" rx="3" fill="none" stroke="#efe6d2" stroke-opacity=".6"/><text x="667" y="354" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1" fill="#efe6d2">ENGINE</text><text x="800" y="383" text-anchor="middle" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-weight="600" font-size="24" fill="#efe6d2">simulate()</text><text x="800" y="409" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#8b8070">picks + work in</text><text x="800" y="431" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#8b8070">a world out</text><rect x="650" y="560" width="300" height="120" rx="6" fill="#050403" stroke="#d9b45a" stroke-width="1.6"/><text x="800" y="602" text-anchor="middle" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-weight="600" font-size="24" fill="#efe6d2">Every screen</text><text x="800" y="628" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#8b8070">Real data · cited