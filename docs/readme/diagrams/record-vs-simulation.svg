<text x="1048" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2" fill="#8b8070">THE SIMULATION · FITTED</text><rect x="80" y="250" width="460" height="84" rx="6" fill="#2a2210" stroke="#d9b45a" stroke-width="1.6"/><text x="310" y="285" text-anchor="middle" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-weight="600" font-size="19" fill="#d9b45a">Polls</text><text x="310" y="311" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#8b8070">Quinnipiac · Marist, 2013</text><rect x="80" y="354" width="460" height="84" rx="6" fill="#2a2210" stroke="#d9b45a" stroke-width="1.6"/><text x="310" y="389" text-anchor="middle" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-weight="600" font-size="19" fill="#d9b45a">Money and rules</text><text x="310" y="415" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#8b8070">filings · $6.4M cap · 6-to-1 match</text><rect x="80" y="458" width="460" height="84" rx="6" fill="#2a2210" stroke="#d9b45a" stroke-width="1.6"/><text x="310" y="493" text-anchor="middle" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-weight="600" font-size="19" fill="#d9b45a">Events and press</text><text x="310" y="519" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#8b8070">real headlines, paraphrased</text><rect x="80" y="562" width="460" height="84" rx="6" fill="#2a2210" stroke="#d9b45a" stroke-width="1.6"/><text x="310" y="597" text-anchor="middle" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-weight="600" font-size="19" fill="#d9b45a">Results</text><text x="310" y="623" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#8b8070">certified, by Assembly District</text><rect x