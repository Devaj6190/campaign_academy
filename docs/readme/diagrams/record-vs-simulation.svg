<text x="64" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#efe6d2">What <tspan font-style="italic" fill="#d9b45a">happened</tspan> stays apart from what <tspan font-style="italic" fill="#d9b45a">you</tspan> did</text>
<text x="64" y="166" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="19" fill="#8b8070">Every number on screen is tagged Real data or Simulated. The engine is fitted to the record, never the other way round.</text><rect x="50" y="200" width="520" height="600" rx="10" fill="#120f0a" stroke="#8f7638" stroke-dasharray="4 5"/>
