<text x="800" y="101" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="14" letter-spacing="4" fill="#a88a45">HONEST BY DESIGN</text>
<text x="800" y="166" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="50" fill="#f1e8d4">What <tspan font-style="italic" fill="#d6b25e">happened</tspan>, kept apart from what <tspan font-style="italic" fill="#d6b25e">you</tspan> did</text>
<text x="800" y="210" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="21" fill="#9a8f7a">Every number on screen is labelled Real data or Simulated.</text><rect x="150" y="270" width="520" height="330" fill="#1d180f" stroke="#d6b25e" stroke-width="1.5"/><text x="410" y="304" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="15" letter-spacing="3" fill="#a88a45">REAL DATA</text><text x="410" y="394" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#d6b25e">The record</text><text x="410" y="432" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="21" fill="#9a8f7a">polls · money · events · results</text><text x="410" y="461" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="21" fill="#9a8f7a">55 sources, every fact cited</text><text x="410" y="490" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="21" fill="#9a8f7a"></text><text x="410" y="519" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="21" fill="#9a8f7a">never changes</text><rect x="930" y="270" width="520" height="330" fill="#13110d" stroke="#5e4d27" stroke-width="1"/><text x="1190" y="304" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="15" letter-spacing="3" fill="#a88a45">SIMULATED</text><text x="1190" y="394" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#f1e8d4">Your campaign</text><text x="1190" y="432" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="21" fill="#9a8f7a">your choices · your staff's work</text><text x="1190" y="461" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="21" fill="#9a8f7a">rival moves · your weekly plan</text><text x="1190" y="490" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="21" fill="#9a8f7a"></text><text x="1190" y="519" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="21" fill="#9a8f7a">simulated by the engine</text><path d="M670,400 L930,400" fill="none" stroke="#a88a45" stroke-width="1.3" stroke-dasharray="5 6" marker-end="url(#h)"/><text x="800" y="384" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-style="italic" fill="#9a8f7a">the engine is fitted to it</text><text x="800" y="440" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="18" fill="#9a8f7a">play the real choices,</text><text x="800" y="462" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="18" fill="#9a8f7a">land on the real result</text><line x1="140" y1="660" x2="1460" y2="660" stroke="#3b3324"/><text x="800" y="716" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#f1e8d4">The agents never see how the race ended.</text><text x="800" y="756" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="19" fill="#9a8f7a">What the campaign really chose, how it turned out and what was said afterwards are kept out of every prompt.</text></svg>
