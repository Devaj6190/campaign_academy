<text x="800" y="101" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="14" letter-spacing="4" fill="#a88a45">FIGURE 1</text>
<text x="800" y="166" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="50" fill="#f1e8d4">The learning cycle</text>
<text x="800" y="210" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="21" fill="#9a8f7a">A real race on its real calendar. At each point where the real campaign decided, the clock stops and the student decides.</text><circle cx="800" cy="590" r="280" fill="none" stroke="#3b3324"/><path d="M922.7439211009416,338.33766703623326 A280,280 0 0 1 1051.6623329637669,467.2560788990583" fill="none" stroke="#a88a45" stroke-width="1.3" marker-end="url(#h)"/><path d="M1051.6623329637669,712.7439211009416 A280,280 0 0 1 922.7439211009416,841.6623329637667" fill="none" stroke="#a88a45" stroke-width="1.3" marker-end="url(#h)"/><path d="M677.2560788990583,841.6623329637667 A280,280 0 0 1 548.3376670362333,712.7439211009416" fill="none" stroke="#a88a45" stroke-width="1.3" marker-end="url(#h)"/><path d="M548.3376670362331,467.2560788990584 A280,280 0 0 1 677.2560788990583,338.33766703623326" fill="none" stroke="#a88a45" stroke-width="1.3" marker-end="url(#h)"/><circle cx="800" cy="590" r="96" fill="#1d180f" stroke="#d6b25e"/><text x="800" y="588" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#d6b25e">The record</text><text x="800" y="622" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="18" letter-spacing="4" fill="#a88a45">EVERY FACT CITED</text><rect x="640" y="254" width="320" height="112" fill="#13110d" stroke="#5e4d27" stroke-width="1"/><text x="800" y="304" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#f1e8d4">A decision point</text><text x="800" y="342" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="21" fill="#9a8f7a">the clock stops</text><rect x="920" y="534" width="320" height="112" fill="#13110d" stroke="#5e4d27" stroke-width="1"/><text x="1080" y="584" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#f1e8d4">The student decides</text><text x="1080" y="622" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="21" fill="#9a8f7a">two staff memos argue options</text><rect x="640" y="814" width="320" height="112" fill="#13110d" stroke="#5e4d27" stroke-width="1"/><text x="800" y="864" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#f1e8d4">The record is shown</text><text x="800" y="902" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="21" fill="#9a8f7a">what the real campaign did</text><rect x="360" y="534" width="320" height="112" fill="#13110d" stroke="#5e4d27" stroke-width="1"/><text x="520" y="584" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#f1e8d4">The campaign runs</text><text x="520" y="622" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="21" fill="#9a8f7a">staff work · rival moves · press</text><text x="250" y="300" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-style="italic" fill="#a88a45">Begin</text><text x="250" y="336" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#f1e8d4">The briefing</text><text x="250" y="364" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="20" fill="#9a8f7a">the race as it really stood</text><path d="M355,330 L625,310" fill="none" stroke="#a88a45" stroke-width="1.3" marker-end="url(#h)"/><text x="1350" y="840" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-style="italic" fill="#a88a45">End</text><text x="1350" y="876" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#f1e8d4">Election night</text><text x="1350" y="904" text-anchor="middle" font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="20" fill="#9a8f7a">your result beside the real one</text><path d="M965,890 L1220,868" fill="none" stroke="#a88a45" stroke-width="1.3" marker-end="url(#h)"/></svg>
